<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoBivida | SIG & Biodiversidade</title>
  <meta name="description" content="O GeoBivida conecta inventários biológicos de fauna e flora, monitorando as condicionantes ambientais e a modelagem geoespacial em painéis WebGIS de alta precisão." />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Tipografia Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #03140c;
      color: #e5f2eb;
    }
    .font-mono-code {
      font-family: 'Space Grotesk', monospace;
    }
    .bg-grid-pattern {
      background-size: 36px 36px;
      background-image: 
        linear-gradient(to right, rgba(16, 185, 129, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(16, 185, 129, 0.04) 1px, transparent 1px);
    }
    .leaflet-popup-content-wrapper {
      background: #051c11 !important;
      color: #e5f2eb !important;
      border: 1px solid #10b981 !important;
      border-radius: 12px !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7) !important;
    }
    .leaflet-popup-tip {
      background: #051c11 !important;
      border: 1px solid #10b981 !important;
    }
  </style>
</head>
<body class="min-h-screen bg-[#03140c] bg-grid-pattern flex flex-col selection:bg-emerald-500 selection:text-black">
